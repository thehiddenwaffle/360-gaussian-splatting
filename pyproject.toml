[project]
name = "gaussian-splatting-360"
version = "0.1.0"
description = "360 Gaussian Splatting"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.4",
    "torchvision",
    "numpy",
    "pillow",
    "opencv-python",
    "plyfile>=0.8.1",
    "pyproj",
    "tqdm",
]

[project.optional-dependencies]
build = [
    "diff-gaussian-rasterization",
    "simple-knn",
]

[tool.uv]
package = false

[tool.uv.extra-build-dependencies]
diff-gaussian-rasterization = ["torch", "setuptools"]
simple-knn = ["torch", "setuptools"]

[tool.uv.sources]
diff-gaussian-rasterization = { path = "submodules/diff-gaussian-rasterization", editable = true }
simple-knn = { path = "submodules/simple-knn", editable = true }
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
